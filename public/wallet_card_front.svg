<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1050" height="600" viewBox="0 0 1050 600">

    <!-- Background -->
    <rect width="1050" height="600" fill="#FFFFFF"/>


    <!-- Heading -->
    <text x="525" y="90" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="54"
          font-weight="500" font-variant="small-caps"
          letter-spacing="3.0px" fill="#000000">
        The Invocation of Rights
    </text>

    <!-- Instruction in true small‑caps -->
    <text x="525" y="140" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="36"
          font-weight="500" font-variant="small-caps"
          letter-spacing="1.5px" fill="#000000">
        say all four lines together
    </text>

    <!-- Hairline rule -->
    <line x1="75" y1="180" x2="975" y2="180"
          stroke="#999999" stroke-width="1.5"/>

    <!-- Script lines -->
    <g font-family="Inter, sans-serif" font-size="48"
       letter-spacing="0.2px" text-rendering="optimizeLegibility"
       text-anchor="middle" fill="#000000">
        <text x="525" y="265">I invoke my right to remain silent.</text>
        <text x="525" y="327">I invoke my right to a lawyer.</text>
        <text x="525" y="389">I don’t consent to any searches.</text>
        <text x="525" y="451">I want to leave. Am I free to go?</text>
    </g>

    <!-- Hairline rule -->
    <line x1="75" y1="505" x2="975" y2="505"
          stroke="#999999" stroke-width="1.5"/>

    <!-- Footer -->
    <text x="525" y="565" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="32"
          fill="#555555" letter-spacing="0.25px">
        invoc8.org/rights
    </text>
</svg>
