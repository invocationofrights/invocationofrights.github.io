<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1050" height="600" viewBox="0 0 1050 600">

    <style>
        /* Inherit front‑side variables */
        :root {
        --color-text: #000000;
        --color-hrule: #999999;
        --color-footer: #444444;
        --hrule-width: 1.5;

        --font: "Inter", sans-serif;

        --header-size: 54px;
        --header-weight: 500;
        --header-spacing: 1.5px;

        --body-size: 40px;
        --body-weight: 300;
        --body-spacing: 0.2px;

        --footer-size: 26px;
        }

        .heading { text-anchor: middle;
        font-family: var(--font);
        font-size: var(--header-size);
        font-weight: var(--header-weight);
        font-variant: small-caps;
        letter-spacing: var(--header-spacing);
        fill: var(--color-text); }

        .step { font-family: var(--font);
        font-size: var(--body-size);
        font-weight: var(--body-weight);
        letter-spacing: var(--body-spacing);
        fill: var(--color-text); }

        .hrule { stroke: var(--color-hrule); stroke-width: var(--hrule-width); }

        .footer { font-family: var(--font);
        font-size: var(--footer-size);
        fill: var(--color-footer); }
    </style>

    <!-- =======  Background  ======= -->
    <rect width="1050" height="600" fill="#FFFFFF"/>

    <!-- Heading -->
    <text class="heading" x="525" y="90">Use It Correctly</text>

    <!-- Hairline rule -->
    <line class="hrule" x1="75" y1="125" x2="975" y2="125"/>
    <line class="hrule" x1="75" y1="505" x2="975" y2="505"/>

    <!-- Steps block -->
    <g class="step" text-anchor="start">
        <text x="70" y="185"><tspan>1.</tspan><tspan dx="30">Speak calmly and clearly.</tspan></text>
        <text x="70" y="255"><tspan>2.</tspan><tspan dx="30">Say all four lines exactly.</tspan></text>
        <text x="70" y="325"><tspan>3.</tspan><tspan dx="30">Repeat if cuffed, moved, or arrested.</tspan></text>
        <text x="70" y="395"><tspan>4.</tspan><tspan dx="30">Stay silent afterward.</tspan></text>
        <text x="70" y="465"><tspan>5.</tspan><tspan dx="30">Follow legal orders such as identifying yourself.</tspan></text>
    </g>

    <!-- QR code -->
    <rect x="815" y="480" width="100" height="100" fill="#CCCCCC"/>

    <!-- Footer -->
    <text class="footer" x="180" y="560">©2025 Invocation of Rights – Rev A 04/25</text>
</svg>
